name: Regressions
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:frontend

  windows-backend:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: ./.github/actions/ffmpeg
      - run: python -m pip install numpy==2.2.6 psutil==7.2.2
      - name: Backend, Windows DPAPI, cancellation and FFmpeg regressions
        run: python -X utf8 -m unittest discover -s tests -v
      - name: Asset downloader and annotation scoring fixtures
        run: python -X utf8 -m unittest discover -s scripts -p "test_*.py" -v
      - name: ASR download plan (no weights downloaded)
        run: python -X utf8 scripts/prepare-asr-model.py --download --dry-run
      - name: Audio download plan (no weights downloaded)
        run: python -X utf8 scripts/prepare-audio-model.py --download --dry-run
      - name: Synthetic render baseline
        run: python -X utf8 scripts/benchmark.py synthetic --output-dir test-results/bench/ci-synthetic
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: synthetic-baseline
          path: test-results/bench/ci-synthetic
          retention-days: 14

  audio-synthetic:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-audio.txt
      - uses: ./.github/actions/ffmpeg
      - run: python -m pip install -r backend/requirements-audio.txt
      - name: Streaming, resampling, thread policy and audio cache regressions (no model weights)
        run: python -X utf8 -m unittest discover -s tests -p "test_audio*.py" -v
