<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SliceAI · 圆形处理动效</title>
<style>
:root{color-scheme:light;--ink:#263044;--muted:#798395;--line:#e1e5ed;--bg:#f3f5f8;--blue:#426ce0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 'Segoe UI','Microsoft YaHei UI',sans-serif}button{font:inherit;cursor:pointer}button:focus-visible{outline:2px solid #5279e7;outline-offset:4px}main{max-width:1140px;margin:auto;padding:38px 32px 28px}header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:27px}.eyebrow{font-size:11px;letter-spacing:1.6px;color:#8a94a5;margin-bottom:7px}h1{font-size:23px;line-height:1.4;font-weight:600;margin:0;letter-spacing:-.5px}.tools{display:flex;gap:8px}.tools button{border:1px solid var(--line);border-radius:7px;background:white;color:#677186;padding:7px 12px;font-size:12px}.tools button:hover{border-color:#9baedb;color:#385fc0}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px}.sample{min-width:0}.stage{position:relative;overflow:hidden;background:#101723;border:1px solid #263249;border-radius:14px;min-height:349px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 6px 20px #1a294b09;transition:background .25s,border .25s}.stage:before{content:'';position:absolute;left:50%;top:41%;width:230px;height:230px;transform:translate(-50%,-50%);background:radial-gradient(circle,#306bd812,transparent 69%);pointer-events:none}.sample-index{position:absolute;left:20px;top:15px;font-size:10px;letter-spacing:1.5px;color:#657187}.state-light{position:absolute;right:19px;top:22px;width:4px;height:4px;background:#7db5ef;border-radius:50%;box-shadow:0 0 8px #70a9f378}canvas{width:230px;height:230px;display:block;position:relative;margin-top:-12px}.status{font-size:15px;letter-spacing:1px;color:#dbe4f4;margin-top:0;display:flex;align-items:center;gap:7px}.dots{display:inline-flex;gap:3px;width:15px}.dots i{height:3px;width:3px;background:#789cce;border-radius:50%;animation:dot 1.5s infinite}.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}.substatus{font-size:10px;color:#637189;margin-top:7px;letter-spacing:.3px}.caption{display:flex;align-items:center;justify-content:space-between;padding:16px 3px 0;gap:8px}.caption h2{font-size:14px;font-weight:600;margin:0}.caption p{font-size:11px;color:#8a94a5;margin:3px 0 0}.pick{color:#6c7a92;background:transparent;border:1px solid #d9e0eb;border-radius:5px;padding:4px 9px;font-size:11px;white-space:nowrap}.pick:hover{color:#426cda;border-color:#9ab0e6}.sample.selected .stage{border-color:#527de2;box-shadow:0 0 0 2px #6c90ee23}.sample.selected .pick{color:#426cda;border-color:#a4b9ed;background:#edf2ff}.footer{margin-top:30px;border-top:1px solid #e0e5ed;padding-top:17px;display:flex;align-items:center;justify-content:space-between;gap:20px;font-size:11px;color:#8a95a6}.footer strong{font-weight:500;color:#627087}.light .stage{background:#fff;border-color:#dfe5ef}.light .status{color:#344158}.light .substatus{color:#8794a8}.light .sample-index{color:#a1acbb}.light .state-light{background:#527ce0}.light .stage:before{background:radial-gradient(circle,#6897f311,transparent 69%)}.paused .dots i{animation-play-state:paused}.compact canvas{width:156px;height:156px;margin-top:0}.compact .stage{min-height:280px}.compact .status{margin-top:8px}@keyframes dot{0%,70%,100%{opacity:.2;transform:translateY(0)}35%{opacity:1;transform:translateY(-2px)}}@media(max-width:800px){main{padding:24px 18px}.grid{gap:10px}canvas{width:190px;height:190px}.stage{min-height:305px}.tools{flex-wrap:wrap;justify-content:flex-end}header{align-items:flex-start}.caption{display:block}.pick{margin-top:8px}}@media(max-width:620px){.grid{grid-template-columns:1fr}.stage{min-height:290px}canvas{width:210px;height:210px}.caption{display:flex;margin-bottom:20px}.pick{margin:0}header{display:block}.tools{justify-content:flex-start;margin-top:17px}.footer{align-items:flex-start;flex-direction:column;gap:5px}}@media(prefers-reduced-motion:reduce){.dots i{animation:none}}
</style>
</head>
<body><main>
<header><div><div class="eyebrow">SLICEAI / MOTION STUDY</div><h1>圆形处理动效</h1></div><div class="tools"><button id="theme">浅色背景</button><button id="size">客户端尺寸</button><button id="pause">暂停动画</button></div></header>
<section class="grid" aria-label="三种圆形处理动效">
<article class="sample"><div class="stage"><span class="sample-index">01 / ORBIT</span><i class="state-light"></i><canvas aria-label="连续旋转的发光圆环"></canvas><div class="status">正在处理<span class="dots"><i></i><i></i><i></i></span></div><div class="substatus">整理片段与生成结果</div></div><div class="caption"><div><h2>旋转光环</h2><p>连续拖尾 · 内外错速旋转</p></div><button class="pick" data-choice="旋转光环">选这版</button></div></article>
<article class="sample"><div class="stage"><span class="sample-index">02 / CHASE</span><i class="state-light"></i><canvas aria-label="围绕圆心依次追逐的光点"></canvas><div class="status">正在处理<span class="dots"><i></i><i></i><i></i></span></div><div class="substatus">整理片段与生成结果</div></div><div class="caption"><div><h2>追逐光点</h2><p>光点接力 · 持续环绕</p></div><button class="pick" data-choice="追逐光点">选这版</button></div></article>
<article class="sample"><div class="stage"><span class="sample-index">03 / CYCLE</span><i class="state-light"></i><canvas aria-label="圆形刻度逐段点亮的循环动画"></canvas><div class="status">正在处理<span class="dots"><i></i><i></i><i></i></span></div><div class="substatus">整理片段与生成结果</div></div><div class="caption"><div><h2>分段循环</h2><p>逐段点亮 · 循环推进</p></div><button class="pick" data-choice="分段循环">选这版</button></div></article>
</section><footer class="footer"><strong id="selection" role="status">三种均为实时动画，可以切换背景和尺寸。</strong><span>状态动效演示 · 不代表实际任务进度</span></footer>
</main><script>
const canvases=[...document.querySelectorAll('canvas')],contexts=canvases.map(c=>c.getContext('2d'));let light=false,paused=matchMedia('(prefers-reduced-motion: reduce)').matches,t=0,last=0,lastDraw=0;const TAU=Math.PI*2;
function init(){canvases.forEach(c=>{const d=Math.min(devicePixelRatio||1,2);c.width=230*d;c.height=230*d});}init();
function stroke(c,r,a,b,color,width=1){c.beginPath();c.arc(115,115,r,a,b);c.strokeStyle=color;c.lineWidth=width;c.lineCap='round';c.stroke();}
function glow(c,x,y,r,alpha=1){const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,`rgba(${light?'73,122,239':'143,208,255'},${alpha})`);g.addColorStop(.2,`rgba(62,137,254,${alpha*.45})`);g.addColorStop(1,'rgba(53,118,245,0)');c.fillStyle=g;c.beginPath();c.arc(x,y,r,0,TAU);c.fill();}
function tail(c,r,head,len,width,alpha=1){const n=95;for(let j=0;j<n;j++){const f=j/(n-1),a=head-len+len*f;stroke(c,r,a,a+len/n+.005,`rgba(${light?'59,106,224':'101,166,255'},${Math.pow(f,2.1)*alpha})`,width*(.45+.55*f));}const x=115+Math.cos(head)*r,y=115+Math.sin(head)*r;glow(c,x,y,11,alpha*.8);c.fillStyle=light?'#4a79ea':'#d6f3ff';c.beginPath();c.arc(x,y,width*.48,0,TAU);c.fill();}
function draw(i,time){const c=contexts[i],d=canvases[i].width/230;c.setTransform(d,0,0,d,0,0);c.clearRect(0,0,230,230);const base=light?'rgba(65,102,181,.09)':'rgba(143,177,230,.09)';const blue=light?'51,103,222':'102,175,255';
 if(i===0){stroke(c,77,0,TAU,base);stroke(c,61,0,TAU,base,.7);stroke(c,42,0,TAU,base,.6);tail(c,77,time*1.7,4.7,3,1);tail(c,61,-time*1.14+2.7,2.9,1.8,.65);tail(c,42,time*.8+1.2,1.7,1,.38);glow(c,115,115,16,.12+.04*Math.sin(time*2));for(let j=0;j<3;j++){const a=time*1.7+.15+j*.1;glow(c,115+Math.cos(a)*77,115+Math.sin(a)*77,2.3,.3-j*.08);}}
 if(i===1){stroke(c,71,0,TAU,base,.7);const head=time*2;for(let j=0;j<18;j++){const a=j/18*TAU-Math.PI/2,behind=((head-a)%TAU+TAU)%TAU,fade=Math.exp(-behind*1.25),r=2.5+fade*2.8,x=115+Math.cos(a)*71,y=115+Math.sin(a)*71;if(fade>.24)glow(c,x,y,13,fade*.65);c.fillStyle=`rgba(${blue},${.12+fade*.88})`;c.beginPath();c.arc(x,y,r,0,TAU);c.fill();}tail(c,52,-time*1.1,1.25,1,.5);const g=c.createRadialGradient(115,115,1,115,115,27);g.addColorStop(0,`rgba(${blue},${.12+.04*Math.sin(time*2)})`);g.addColorStop(1,`rgba(${blue},0)`);c.fillStyle=g;c.fillRect(85,85,60,60);for(let j=0;j<3;j++){c.fillStyle=`rgba(${blue},${.2+.5*(Math.sin(time*3-j*.8)+1)/2})`;c.beginPath();c.arc(107+j*8,115,1.8,0,TAU);c.fill();}}
 if(i===2){const head=time*1.5;for(let j=0;j<48;j++){const a=j/48*TAU-Math.PI/2,behind=((head-a)%TAU+TAU)%TAU,f=Math.exp(-behind*.85);c.strokeStyle=`rgba(${blue},${.09+.91*f})`;c.lineWidth=2.2;c.lineCap='round';c.beginPath();c.moveTo(115+Math.cos(a)*66,115+Math.sin(a)*66);c.lineTo(115+Math.cos(a)*(75+f*3),115+Math.sin(a)*(75+f*3));c.stroke();}stroke(c,53,0,TAU,base,.7);tail(c,53,-time*.75+2,2.7,1.5,.58);stroke(c,86,head-.5,head+.08,`rgba(${blue},.35)`,.75);const a=time*.65;for(let j=0;j<4;j++){const ang=a+j*Math.PI/2;stroke(c,22,ang,ang+.55,`rgba(${blue},${.25+.13*Math.sin(time*2)})`,1.3);}}
}
function frame(now){const dt=last?Math.min((now-last)/1000,.08):0;last=now;if(!paused&&!document.hidden){t+=dt;if(now-lastDraw>30){canvases.forEach((_,i)=>draw(i,t));lastDraw=now;}}requestAnimationFrame(frame);}canvases.forEach((_,i)=>draw(i,0));requestAnimationFrame(frame);
document.getElementById('theme').onclick=e=>{light=!light;document.body.classList.toggle('light',light);e.target.textContent=light?'深色背景':'浅色背景';canvases.forEach((_,i)=>draw(i,t));};document.getElementById('size').onclick=e=>{document.body.classList.toggle('compact');e.target.textContent=document.body.classList.contains('compact')?'放大查看':'客户端尺寸';};const pauseButton=document.getElementById('pause');pauseButton.textContent=paused?'播放动画':'暂停动画';document.body.classList.toggle('paused',paused);pauseButton.onclick=()=>{paused=!paused;document.body.classList.toggle('paused',paused);pauseButton.textContent=paused?'继续动画':'暂停动画';};document.querySelectorAll('.pick').forEach(b=>b.onclick=()=>{document.querySelectorAll('.sample').forEach(a=>a.classList.remove('selected'));document.querySelectorAll('.pick').forEach(a=>a.textContent='选这版');b.closest('.sample').classList.add('selected');b.textContent='已选择';document.getElementById('selection').textContent='当前选择：'+b.dataset.choice+' · 仅选择设计，不修改客户端';});document.addEventListener('visibilitychange',()=>{last=performance.now()});
document.querySelectorAll('.pick')[1].click();
</script></body></html>
