;margin-top:24px;border-top:1px solid #edf0f4;font-size:11px;color:#8a94a4}.agent-working .agent-spinner{width:13px;height:13px}.agent-working .agent-spinner svg{width:13px;height:13px}.agent-working-text{background:linear-gradient(100deg,#a3aab6 15%,#536074 45%,#a3aab6 70%);background-size:240% auto;background-clip:text;-webkit-background-clip:text;color:transparent;animation:agent-shimmer 2.8s linear infinite}.agent-progress{height:2px;background:#edf0f5;border-radius:2px;overflow:hidden;margin-top:10px;max-width:174px}.agent-progress i{display:block;height:100%;width:0;background:#91a2bd;transition:width .3s linear}.agent-step-detail{font-size:10px;margin-top:8px;color:#a2acba;font-variant-numeric:tabular-nums}.agent-step.active .agent-marker{color:#5b6d89}.panel-body:has(.agent-run) .requirements{border:0;margin-top:25px;padding-top:0}.requirements button{color:#a0a9b6;font-size:10px}.panel-body:has(.agent-run) .requirements .chips{font-size:10px}.panel-footer{background:#fff;padding:13px 21px;min-height:45px;border-top:1px solid #edf0f4}.panel-footer .foot-note{color:#a3acb8;font-size:10px}.agent-step.active{animation:agent-in .28s ease-out}@keyframes agent-spin{to{transform:rotate(360deg)}}@keyframes agent-shimmer{to{background-position:-240% 0}}@keyframes agent-in{from{opacity:.3;transform:translateY(3px)}to{opacity:1;transform:none}}@media(max-height:690px){.panel-heading{padding:13px 18px}.panel-body:has(.agent-run){padding:17px 19px 13px}.agent-intro{margin-bottom:17px;font-size:12px}.agent-step{padding-bottom:16px}.agent-step-note{font-size:10px;margin-top:2px}.agent-working{margin-top:16px;padding-top:12px}.panel-body:has(.agent-run) .requirements{margin-top:17px}.panel-footer{padding:10px 18px;min-height:41px}}@media(prefers-reduced-motion:reduce){.agent-spinner svg,.agent-working-text{animation:none}.agent-working-text{background:none;color:#8591a3}}

<script>
const $=id=>document.getElementById(id),icon=id=>`<svg aria-hidden="true"><use href="#${id}"/></svg>`;
const stages=[{title:'正在理解这个片段',sub:'梳理来龙去脉，找到故事的重点',name:'理解片段',note:'已梳理故事铺垫与情绪转折',icon:'lines',start:0,end:6500},{title:'让故事更紧凑一些',sub:'保留完整经过，整理重复与停顿',name:'整理内容',note:'保留完整故事，整理冗余表达',icon:'cut',start:6500,end:14500},{title:'让主播的声音更清楚',sub:'降低背景音乐，保留说话与笑声',name:'处理声音',note:'已降低背景音乐并均衡音量',icon:'sound',start:14500,end:29500},{title:'正在生成你的成片',sub:'合成画面与声音，检查片段衔接',name:'生成成片',note:'预览已生成，可以检查与导出',icon:'film',start:29500,end:36000}];
let loopAudio=true;
let elapsed=0,phase=-1,paused=false,cancelled=false,speed=1,last=performance.now(),lastPaint=0,decisionCount=-1,toastTimer;
const stamp=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(Math.floor(s%60)).padStart(2,'0')}`;

function renderTrail(index){$('trail').innerHTML=stages.map((s,i)=>`<div class="trail-row ${i<index?'done':i===index?'active':''}"><span class="step-icon">${i<index?'✓':''}</span><div><span class="step-name">${s.name}</span>${i<index?`<span class="step-note">${s.note}</span>`:''}</div><span class="step-state">${i<index?'完成':i===index?'进行中':''}</span></div>`).join('');}
function enter(index){phase=index;decisionCount=-1;$('stageSelect').value=String(index);$('requirements').hidden=true;$('requirementsToggle').setAttribute('aria-expanded','false');$('chevron').textContent='⌄';$('panelHeading').textContent=index===4?'细剪完成':'正在细剪';$('liveDot').hidden=index===4;$('executionLabel').textContent=index===4?'全部完成':'正在处理';$('stageIndex').textContent=index===4?'04 / 04':`0${index+1} / 04`;$('currentTitle').textContent=index===4?'可以看看成片了':stages[index].title;$('currentSub').textContent=index===4?'先预览，不满意还可以继续调整':stages[index].sub;$('announcer').textContent=$('currentTitle').textContent;
 document.querySelectorAll('.route i').forEach((el,i)=>{el.className=i<index?'done':i===index?'active'+(index>=2?' real':''):'';el.style.setProperty('--progress','0%');});
 $('cancel').hidden=index===4;$('exportTop').disabled=index!==4;$('resultTab').disabled=index!==4;$('appStatus').textContent=index===4?'细剪完成':'1 个细剪任务处理中';renderTrail(index);
 $('panelFooter').innerHTML=index===4?'<button class="button" id="adjust">调整要求</button><button class="button primary" id="viewResult">查看成片 →</button>':`<span class="foot-note">${icon('clock')}<span id="elapsedTime">已用时 00:00</span><span style="color:#c4ccd8">·</span>可以切换页面</span>`;
 if(index===4){$('pauseDemo').querySelector('span').textContent='重新演示';$('activity').innerHTML=`<div class="success-card"><div class="success-mark">${icon('check')}</div><h3>这段故事，剪好了</h3><p>内容、声音与画面已处理完成</p><div class="duration-result"><span>11:57</span><span>→</span><b>09:46</b></div><div class="success-pills"><span>保留完整故事</span><span>声音已处理</span></div></div>`;$('adjust').onclick=()=>toast('设计演示：返回固定问答，调整剪辑要求');$('viewResult').onclick=showResult;return;}
 const titles=['理解片段内容','整理剪辑内容','降低背景音乐','生成成片'];
 const completed=['已梳理故事经过与情绪转折','已整理重复表达与长停顿','已处理声音并均衡音量','预览文件已就绪'];
 const activeNotes=['阅读转写，确认上下文','按你的要求整理，保留完整表达','保留主播说话与自然反应','合成画面与声音，检查衔接'];

}

function paint(){if(cancelled)return;const index=elapsed>=36000?4:stages.findIndex(s=>elapsed<s.end);if(index!==phase)enter(index);if(index===4)return;const s=stages[index],progress=Math.max(0,Math.min(1,(elapsed-s.start)/(s.end-s.start)));if($('elapsedTime'))$('elapsedTime').textContent='已用时 '+stamp(elapsed/1000);if(index>=2)document.querySelectorAll('.route i')[index].style.setProperty('--progress',`${progress*100}%`);
 if(index>=2){$('agentProgress').style.width=(progress*100)+'%';$('agentDetail').textContent=index===2?'已处理 '+stamp(progress*586)+' / 09:46 · '+Math.floor(progress*100)+'%':Math.floor(progress*100)+'%';}

}

function reset(t=0){elapsed=t;phase=-1;cancelled=false;paused=false;document.body.classList.remove('paused');$('pauseDemo').querySelector('span').textContent='暂停演示';$('sourceTab').classList.add('on');$('resultTab').classList.remove('on');$('viewerTime').textContent='00:00 / 11:57';$('planTitle').textContent='当前方案 · 保留完整故事';$('planText').textContent='保留事情的来龙去脉与情绪反应，整理重复表达和长停顿。';last=performance.now();paint();}
function showResult(){$('sourceTab').classList.remove('on');$('resultTab').classList.add('on');$('viewerTime').textContent='00:00 / 09:46';$('planTitle').textContent='成片预览 · 09:46';$('planText').textContent='设计演示：完成后直接进入成片预览，可继续修改字幕与剪辑方案。';toast('当前为设计稿，仅切换成片示意状态');}
$('sourceTab').onclick=()=>{$('sourceTab').classList.add('on');$('resultTab').classList.remove('on');$('viewerTime').textContent='00:00 / 11:57';$('planTitle').textContent='当前方案 · 保留完整故事';$('planText').textContent='保留事情的来龙去脉与情绪反应，整理重复表达和长停顿。';};$('resultTab').onclick=showResult;
$('pauseDemo').onclick=()=>{if(cancelled||phase===4){reset();return;}paused=!paused;document.body.classList.toggle('paused',paused);$('pauseDemo').querySelector('span').textContent=paused?'继续演示':'暂停演示';$('executionLabel').textContent=paused?'演示已暂停':'正在处理';last=performance.now();};
$('replayDemo').onclick=()=>{loopAudio=false;reset();};$('stageSelect').onchange=e=>{const n=Number(e.target.value);loopAudio=n===2;reset(n===4?36000:stages[n].start);};$('speed').onchange=e=>{speed=Number(e.target.value);};$('focus').onclick=()=>{document.body.classList.toggle('focus');$('focus').textContent=document.body.classList.contains('focus')?'查看完整界面':'只看进度面板';};
$('requirementsToggle').onclick=()=>{const show=$('requirements').hidden;$('requirements').hidden=!show;$('requirementsToggle').setAttribute('aria-expanded',String(show));$('chevron').textContent=show?'⌃':'⌄';};
$('cancel').onclick=()=>{cancelled=true;paused=true;document.body.classList.add('paused');$('panelHeading').textContent='已停止';$('currentTitle').textContent='本次处理已取消';$('currentSub').textContent='已有方案与原片段都还在';$('executionLabel').textContent='已停止';$('liveDot').hidden=true;$('cancel').hidden=true;$('activity').innerHTML=`<div class="cancel-view">${icon('folder')}<h3>草稿已保留</h3><p>随时可以调整要求后重新开始</p></div>`;$('trail').innerHTML='';document.querySelectorAll('.route i').forEach(el=>el.className='');$('appStatus').textContent='就绪';$('panelFooter').innerHTML='<button class="button primary" id="restart">重新开始演示</button>';$('restart').onclick=()=>reset();$('pauseDemo').querySelector('span').textContent='重新演示';$('announcer').textContent='处理已取消，草稿已保留';};
$('exportTop').onclick=()=>toast('当前为设计稿，实际客户端会在这里导出成片');
document.querySelectorAll('[data-demo-note]').forEach(el=>el.onclick=()=>toast(el.dataset.demoNote));
document.addEventListener('visibilitychange',()=>{last=performance.now();});
function agentSpinner(){return '<span class="agent-spinner" aria-hidden="true"><svg viewBox="0 0 24 24">'+Array.from({length:12},(_,i)=>`<rect x="11" y="2" width="2" height="5" rx="1" opacity="${.12+i*.075}" transform="rotate(${i*30} 12 12)"/>`).join('')+'</svg></span>';}
const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
function loop(now){const dt=Math.min(120,now-last);last=now;if(!paused&&!cancelled&&!document.hidden&&elapsed<36000){elapsed=Math.min(36000,elapsed+dt*speed);if(loopAudio&&phase===2&&elapsed>=29500)elapsed=14500;if(now-lastPaint>65){paint();lastPaint=now;}}requestAnimationFrame(loop);}reset(16000);requestAnimationFrame(loop);
</script>
