<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>SliceAI — 全自动录播切片</title>
  <link rel="icon" type="image/svg+xml" href="/sliceai.svg">
  <link rel="stylesheet" href="/src/desktop.css">
  <link rel="stylesheet" href="/src/fine.css">
</head>
<body>
  <svg class="sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1.5"/><rect x="14" y="4" width="6" height="6" rx="1.5"/><rect x="4" y="14" width="6" height="6" rx="1.5"/><rect x="14" y="14" width="6" height="6" rx="1.5"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7V5a1 1 0 0 1 1-1h6l2 3h8a1 1 0 0 1 1 1v11H3z"/></symbol>
    <symbol id="i-history" viewBox="0 0 24 24"><path d="M4 9a8 8 0 1 1 0 7M4 3v6h6M12 7v5l3 2"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m-4-4 4 4 4-4M4 16v5h16v-5"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3"/><circle cx="16" cy="17" r="3"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M4 12h16m-6-6 6 6-6 6"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M20 12H4m6-6-6 6 6 6"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V3m-4 4 4-4 4 4M4 14v7h16v-7"/></symbol>
    <symbol id="i-film" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 9h4m-4 6h4M17 9h4m-4 6h4"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="m9 5 11 7-11 7z"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M5 3h9l5 5v13H5zM14 3v6h5M8 13h8m-8 4h6"/></symbol>
    <symbol id="i-text" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9h10M7 13h6m-6 4h8"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M4 4h16v13H9l-5 4zM8 9h8m-8 4h5"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
    <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 9a3 3 0 1 1 5 2c-2 1-2 2-2 3m0 3v.1"/></symbol>
    <symbol id="i-wave" viewBox="0 0 24 24"><path d="M3 10v4m4-8v12m5-15v18m5-15v12m4-8v4"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6zM8 12l3 3 5-6"/></symbol>
  </defs></svg>

  <div class="app-layout">
    <aside class="sidebar">
      <a class="brand" href="#home" aria-label="SliceAI 首页"><img class="brand-mark" src="/sliceai.svg" alt=""><span>SliceAI</span></a>
      <nav aria-label="主导航">
        <button class="nav-item active" data-page="home"><svg><use href="#i-plus"/></svg><span>新建切片</span></button>
        <button class="nav-item" data-page="tasks"><svg><use href="#i-history"/></svg><span>任务</span><span class="nav-count" id="taskCount">0</span></button>
        <button class="nav-item" data-page="exports"><svg><use href="#i-download"/></svg><span>导出记录</span></button>
      </nav>
      <div class="sidebar-bottom"><button class="nav-item" data-action="settings"><svg><use href="#i-settings"/></svg><span>设置</span></button></div>
    </aside>
    <div class="main-shell">
      <header class="topbar"><b id="pageBreadcrumb">新建切片</b><button class="icon-button" data-action="help" aria-label="使用帮助" title="使用帮助"><svg><use href="#i-help"/></svg></button></header>
      <main id="pageContent">
        <section id="homePage" class="page home-page">
          <div class="source-column">
            <section class="source-panel" aria-label="导入录播">
              <div class="panel-heading"><h2>录播文件</h2><span class="muted">拖入或选择</span></div>
              <div class="dropzone" id="dropzone" tabindex="0" role="button" aria-label="选择或拖入录播视频"><div id="dropzoneContent"><span class="drop-icon"><svg><use href="#i-film"/></svg></span><h3>添加录播</h3><p>点击选择，或拖放到这里</p><small>MP4 · MKV · FLV · MOV</small></div></div>
              <div class="attachments"><div class="attachment-group"><button class="attachment" id="subtitleButton" title="可选 SRT / VTT 字幕"><svg><use href="#i-text"/></svg><span id="subtitleName">已有转写</span><svg class="attach-plus"><use href="#i-plus"/></svg></button><button class="attachment-remove" id="subtitleRemove" aria-label="移除字幕" title="移除字幕" hidden>×</button></div><div class="attachment-group"><button class="attachment" id="chatButton" title="可选 XML / JSON 弹幕"><svg><use href="#i-chat"/></svg><span id="chatName">添加弹幕</span><svg class="attach-plus"><use href="#i-plus"/></svg></button><button class="attachment-remove" id="chatRemove" aria-label="移除弹幕" title="移除弹幕" hidden>×</button></div></div>
              <label class="audio-track-field" id="audioTrackField" hidden><span>处理音轨</span><select id="audioTrack" aria-label="处理音轨"></select></label>
              <div class="privacy-note" title="视频和 ASR 在本机处理。AI 接收转写与可选弹幕；开启来源复核时，还会发送候选片段的少量缩略画面。"><svg><use href="#i-shield"/></svg>本地转写 · AI 接收字幕与候选画面</div>
            </section>
            <section class="recent-panel" aria-label="最近任务"><div class="panel-heading"><h2>最近任务 <span id="recentCount">0</span></h2><button class="text-button" data-page="tasks">全部 <svg><use href="#i-chevron"/></svg></button></div><div id="recentTasks" class="scroll-area"></div></section>
          </div>
          <section class="preference-section" aria-label="切片选项">
            <div class="panel-heading"><h2>查找事件</h2></div>
            <div class="preference-fields">
              <fieldset><legend>内容偏好</legend><div class="topic-choices" id="topicChoices"><button class="active" data-value="自动判断" aria-pressed="true">自动判断</button><button data-value="搞笑整活">搞笑整活</button><button data-value="聊天故事">聊天故事</button><button data-value="弹幕互动">弹幕互动</button></div></fieldset>
              <div class="option-checks"><div class="check-with-help"><label class="check-row" title="通过候选画面与字幕复核。保留有实质评论的观看片段；无法判断的暂不导出。需要模型支持图片输入。"><input id="excludePlayback" type="checkbox" checked>过滤纯播放内容</label><button type="button" class="inline-help" data-action="filterInfo" aria-label="来源过滤说明">?</button></div></div>
            </div>
            <div class="start-area"><p id="startHint">请选择录播</p><button class="primary-button" id="startButton" disabled><svg><use href="#i-play"/></svg>查找完整事件</button></div>
          </section>
        </section>
        <section id="tasksPage" class="page library-page" hidden><div class="library-toolbar"><div class="tabs"><button class="active" data-task-filter="all">全部</button><button data-task-filter="complete">已完成</button><button data-task-filter="cancelled">已取消</button></div><label class="search-field"><svg><use href="#i-search"/></svg><input id="taskSearch" placeholder="搜索任务" aria-label="搜索录播名称"></label><button class="primary-button" data-page="home"><svg><use href="#i-plus"/></svg>新建</button></div><div class="task-table"><div class="task-table-head"><span>录播</span><span>片段</span><span>状态</span><span></span></div><div id="allTasks" class="scroll-area"></div></div></section>
        <section id="processingPage" class="page" hidden><div id="processingContent"></div></section>
        <section id="resultsPage" class="page" hidden><div id="resultsContent"></div></section>
        <section id="finePage" class="page" hidden></section>
        <section id="exportsPage" class="page library-page" hidden><div class="library-toolbar"><h2>已导出的文件</h2><span class="muted">保存在本机</span></div><div id="exportRecords" class="scroll-area export-list"></div></section>
      </main>
      <footer class="statusbar"><span id="appStatus" role="button" tabindex="0" aria-label="查看处理队列">就绪</span><span class="design-badge">v0.2.0</span></footer>
    </div>
  </div>
  <dialog id="modal"><form method="dialog"><button class="icon-button close-modal" aria-label="关闭弹窗"><svg><use href="#i-close"/></svg></button></form><div id="modalContent"></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
